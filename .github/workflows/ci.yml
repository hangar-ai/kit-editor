name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    uses: hangar-ai/.github/.github/workflows/kit-check.yml@v1

  # The native tab: its tests, and the committed module checked against the
  # source. Rust comes from native/rust-toolchain.toml, which rustup installs
  # with the wasm32-unknown-unknown target on the first cargo call there.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: native
        run: cargo test --locked
      - name: Build the module
        run: scripts/build-native.sh
      - name: The committed module is the one the source makes
        run: |
          if ! git diff --quiet -- tabs/editor.wasm; then
            echo "::error file=tabs/editor.wasm::tabs/editor.wasm is stale: run scripts/build-native.sh and commit it"
            exit 1
          fi
